services:
  - type: web
    name: cp4-arena-web
    env: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # ضع رابط PostgreSQL المجاني (مثل Neon.tech أو Supabase أو Render Postgres) لحفظ البطولات واللاعبين وحسابات المساعدين والصور بعد سكون الموقع
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CP4_SESSION_SECRET
        generateValue: true
      - key: CP4_HEAD_ADMIN_USERNAME
        value: Djilali
      - key: CP4_HEAD_ADMIN_PIN
        sync: false
      # اختياري: قائمة JSON لحسابات المساعدين لتُنشأ تلقائياً حتى على قرص مؤقت بدون قاعدة سحابية
      - key: CP4_SUB_ADMINS_JSON
        sync: false
      # ربط Discord OAuth وملفات اللاعبين الموحدة وقائمة أعضاء البوت
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ADMIN_CHANNEL_ID
        sync: false
      - key: DISCORD_PUBLIC_CHANNEL_ID
        sync: false
